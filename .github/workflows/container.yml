name: container

# Publishes the image to GHCR so Unraid has a registry identity to compare against:
# the Docker tab can then show "up-to-date" instead of the orange "not available",
# which is what it says for an image with no RepoDigests (a local `docker build`).
#
# Tags: ghcr.io/shaggydragon/mediaexplorer:latest and :<VERSION file>, amd64 only
# (the app is pure Python + ffmpeg; no arm build is needed for the two Unraid boxes).
#
# Actions are pinned by commit SHA so a moved tag cannot change what runs here.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # GITHUB_TOKEN can publish to this repo's packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read VERSION
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/shaggydragon/mediaexplorer:latest
            ghcr.io/shaggydragon/mediaexplorer:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/ShaggyDragon/MediaExplorer
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.title=MediaExplorer
          cache-from: type=gha
          cache-to: type=gha,mode=max
